name: Audit Patch 095 PHP 7.4

on:
  push:
    paths:
      - ".github/workflows/audit-095-php74.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
      - name: Lint 095 files on PHP 7.4
        shell: bash
        run: |
          set -euo pipefail
          php -v
          root="patch-src/UMSR/095_PATCH-UMSR-CURRICULUM-RPS-FOUNDATION-GATE-AI-COMPLETION-V1/deploy/application"
          find "$root" -type f -name '*.php' -print0 | while IFS= read -r -d '' f; do
            echo "===== $f ====="
            php -l "$f"
          done
