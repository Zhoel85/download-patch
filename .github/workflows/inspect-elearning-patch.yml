name: Inspect E-Learning Patch Internals
on:
  push:
    paths:
      - ".github/workflows/inspect-elearning-patch.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect archived E-Learning patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/inspect
          for f in             041_PATCH-UMSR-ELEARNING-BSI-BUSINESS-VALIDATION-SWEETALERT-FIX-V1.zip             043_PATCH-UMSR-ELEARNING-RPS-JENJANG-PRODI-STATUS-MAPPING-FIX-V1.zip             046_PATCH-UMSR-ELEARNING-RPS-QA-MINIMUM-MASTER-FIX-V1.zip             048_PATCH-UMSR-ELEARNING-RPS-PRODI-REVIEW-NONBLOCKING-FIX-V1.zip
          do
            echo "===== ARCHIVE $f ====="
            curl -fsSL "https://raw.githubusercontent.com/Zhoel85/coding/main/patches/elearning/$f" -o "/tmp/inspect/$f"
            unzip -Z1 "/tmp/inspect/$f"
            d="/tmp/inspect/${f%.zip}"
            mkdir -p "$d"
            unzip -q "/tmp/inspect/$f" -d "$d"
            echo "----- RELEVANT CONTENT -----"
            find "$d" -type f \( -name '*.php' -o -name '*.sql' -o -name '*.txt' \) | sort | while read -r p; do
              if grep -Eqi 'Elearning_plan|curriculum|rps|foundation|context|qa|gate' "$p" || echo "$p" | grep -Eqi 'Elearning_plan|curriculum|rps'; then
                echo "### FILE: ${p#$d/}"
                sed -n '1,260p' "$p"
              fi
            done
          done
