name: Patch Builder

on:
  push:
    paths:
      - 'patch-src/caleg/**/READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve patch
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          READY_FILE="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'patch-src/caleg/**/READY' | head -n 1)"
          if [ -z "$READY_FILE" ]; then
            READY_FILE="$(find patch-src/caleg -name READY -type f | sort | tail -n 1)"
          fi
          PATCH_DIR="$(dirname "$READY_FILE")"
          PATCH_CODE="$(basename "$PATCH_DIR")"
          FILE_NAME="$PATCH_CODE.zip"
          TAG_NAME="caleg-$PATCH_CODE"

          test -d "$PATCH_DIR/package"
          test -f "$PATCH_DIR/package/manifest.json"

          echo "patch_dir=$PATCH_DIR" >> "$GITHUB_OUTPUT"
          echo "patch_code=$PATCH_CODE" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate package source
        shell: bash
        run: |
          set -euo pipefail
          PATCH_DIR="${{ steps.meta.outputs.patch_dir }}"
          jq -e . "$PATCH_DIR/package/manifest.json" >/dev/null

          while IFS= read -r -d '' phpfile; do
            php -l "$phpfile"
          done < <(find "$PATCH_DIR/package" -type f -name '*.php' -print0)

          while IFS= read -r -d '' jsfile; do
            node --check "$jsfile"
          done < <(find "$PATCH_DIR/package/FILES" -type f -name '*.js' -print0)

      - name: Build and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          PATCH_DIR="${{ steps.meta.outputs.patch_dir }}"
          FILE_NAME="${{ steps.meta.outputs.file_name }}"

          (
            cd "$PATCH_DIR/package"
            zip -qr "$GITHUB_WORKSPACE/$FILE_NAME" .
          )

          unzip -t "$FILE_NAME"
          SHA256="$(sha256sum "$FILE_NAME" | awk '{print $1}')"
          echo "$SHA256  $FILE_NAME" > "$FILE_NAME.sha256"
          echo "SHA-256: $SHA256"

      - name: Upload chat handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.patch_code }}
          path: |
            ${{ steps.meta.outputs.file_name }}
            ${{ steps.meta.outputs.file_name }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag_name }}"
          FILE_NAME="${{ steps.meta.outputs.file_name }}"
          PATCH_CODE="${{ steps.meta.outputs.patch_code }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE_NAME" "$FILE_NAME.sha256" --clobber
          else
            gh release create "$TAG" "$FILE_NAME" "$FILE_NAME.sha256" \
              --title "$PATCH_CODE" \
              --notes "Built from repository source, ZIP-tested, SHA-256 verified, and uploaded as a workflow artifact."
          fi
