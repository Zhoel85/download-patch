name: Patch Builder

on:
  push:
    paths:
      - 'patch-src/caleg/**/build.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve patch source
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'patch-src/caleg/**/build.json' | head -n 1)"
          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE="$(find patch-src/caleg -name build.json -type f | sort | tail -n 1)"
          fi

          PATCH_DIR="$(dirname "$BUILD_FILE")"
          PATCH_CODE="$(jq -r '.patch_code' "$BUILD_FILE")"
          FILE_NAME="$(jq -r '.file_name' "$BUILD_FILE")"
          PACKAGE_DIR="$PATCH_DIR/package"
          TAG_NAME="caleg-${PATCH_CODE}"

          test -d "$PACKAGE_DIR"
          test -f "$PACKAGE_DIR/manifest.json"

          echo "patch_dir=$PATCH_DIR" >> "$GITHUB_OUTPUT"
          echo "package_dir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "patch_code=$PATCH_CODE" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Build and verify patch ZIP
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="${{ steps.meta.outputs.package_dir }}"
          FILE_NAME="${{ steps.meta.outputs.file_name }}"

          (
            cd "$PACKAGE_DIR"
            zip -qr "$GITHUB_WORKSPACE/$FILE_NAME" .
          )

          unzip -t "$FILE_NAME"
          sha256sum "$FILE_NAME" | tee "$FILE_NAME.sha256"

          ROOT_MANIFEST="$(unzip -Z1 "$FILE_NAME" | grep -x 'manifest.json' || true)"
          if [ "$ROOT_MANIFEST" != "manifest.json" ]; then
            echo "manifest.json is not at ZIP root"
            exit 1
          fi

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag_name }}"
          FILE_NAME="${{ steps.meta.outputs.file_name }}"
          PATCH_CODE="${{ steps.meta.outputs.patch_code }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE_NAME" "$FILE_NAME.sha256" --clobber
          else
            gh release create "$TAG" "$FILE_NAME" "$FILE_NAME.sha256" \
              --title "$PATCH_CODE" \
              --notes "Patch built and verified automatically by GitHub Actions."
          fi
