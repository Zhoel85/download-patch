name: Patch Builder

on:
  push:
    paths:
      - 'patch-src/caleg/**/part-*.b64'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve patch source
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'patch-src/caleg/**/part-*.b64' | head -n 1)"
          if [ -z "$CHANGED" ]; then
            echo "No patch part detected."
            exit 1
          fi

          PATCH_DIR="$(dirname "$CHANGED")"
          PATCH_CODE="$(basename "$PATCH_DIR")"
          FILE_NAME="$PATCH_CODE.zip"
          TAG_NAME="caleg-$PATCH_CODE"

          test -f "$PATCH_DIR/sha256.txt"

          echo "patch_dir=$PATCH_DIR" >> "$GITHUB_OUTPUT"
          echo "patch_code=$PATCH_CODE" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Build and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          PATCH_DIR="${{ steps.meta.outputs.patch_dir }}"
          FILE_NAME="${{ steps.meta.outputs.file_name }}"

          cat "$PATCH_DIR"/part-*.b64 | tr -d '\r\n\t ' | base64 --decode > "$FILE_NAME"
          unzip -t "$FILE_NAME"

          EXPECTED="$(tr -d '\r\n ' < "$PATCH_DIR/sha256.txt")"
          ACTUAL="$(sha256sum "$FILE_NAME" | awk '{print $1}')"

          echo "Expected: $EXPECTED"
          echo "Actual  : $ACTUAL"

          test "$EXPECTED" = "$ACTUAL"
          echo "$ACTUAL  $FILE_NAME" > "$FILE_NAME.sha256"

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag_name }}"
          FILE_NAME="${{ steps.meta.outputs.file_name }}"
          PATCH_CODE="${{ steps.meta.outputs.patch_code }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE_NAME" "$FILE_NAME.sha256" --clobber
          else
            gh release create "$TAG" "$FILE_NAME" "$FILE_NAME.sha256" \
              --title "$PATCH_CODE" \
              --notes "Verified patch generated automatically from text chunks."
          fi
