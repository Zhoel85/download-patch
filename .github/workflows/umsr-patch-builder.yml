name: UMSR Native Patch Builder

on:
  push:
    paths:
      - "patch-src/UMSR/**/READY"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Resolve patch
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          READY_FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^patch-src/UMSR/.*/READY$' | head -n 1 || true)"
          if [ -z "$READY_FILE" ]; then
            echo "No READY file changed in triggering commit."
            exit 1
          fi

          PATCH_DIR="$(dirname "$READY_FILE")"
          PATCH_CODE="$(basename "$PATCH_DIR")"
          BUILD_DIR="$PATCH_DIR/deploy"
          FILE_NAME="$PATCH_CODE.zip"
          TAG_NAME="umsr-$PATCH_CODE"

          test -d "$BUILD_DIR/application"

          echo "build_dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          echo "patch_code=$PATCH_CODE" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate native payload
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="${{ steps.meta.outputs.build_dir }}"

          COUNT_ROOT="$(find "$BUILD_DIR" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          test "$COUNT_ROOT" = "1"
          test -d "$BUILD_DIR/application"

          while IFS= read -r -d '' phpfile; do
            php -l "$phpfile"
          done < <(find "$BUILD_DIR/application" -type f -name '*.php' -print0)

          while IFS= read -r -d '' sqlfile; do
            if grep -Eiq '(DROP[[:space:]]+TABLE|TRUNCATE|DELETE[[:space:]]+FROM|INSERT[[:space:]]+INTO|UPDATE[[:space:]]+[A-Za-z0-9_]+[[:space:]]+SET|UNIQUE[[:space:]]+(KEY|INDEX)|FOREIGN[[:space:]]+KEY|CONSTRAINT|TRIGGER|PROCEDURE)' "$sqlfile"; then
              echo "Blocked SQL token in $sqlfile"
              exit 1
            fi
          done < <(find "$BUILD_DIR/application" -type f -name '*.sql' -print0)

      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="${{ steps.meta.outputs.build_dir }}"
          FILE_NAME="${{ steps.meta.outputs.file_name }}"

          (
            cd "$BUILD_DIR"
            zip -qr "$GITHUB_WORKSPACE/$FILE_NAME" application
          )

          unzip -t "$FILE_NAME"

          OUTSIDE="$(unzip -Z1 "$FILE_NAME" | grep -Ev '^application(/|$)' || true)"
          if [ -n "$OUTSIDE" ]; then
            echo "ZIP contains entries outside application/:"
            echo "$OUTSIDE"
            exit 1
          fi

          SHA256="$(sha256sum "$FILE_NAME" | awk '{print $1}')"
          echo "$SHA256  $FILE_NAME" > "$FILE_NAME.sha256"
          echo "SHA-256: $SHA256"
          unzip -Z1 "$FILE_NAME"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.patch_code }}
          path: |
            ${{ steps.meta.outputs.file_name }}
            ${{ steps.meta.outputs.file_name }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag_name }}"
          FILE_NAME="${{ steps.meta.outputs.file_name }}"
          PATCH_CODE="${{ steps.meta.outputs.patch_code }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE_NAME" "$FILE_NAME.sha256" --clobber
          else
            gh release create "$TAG" "$FILE_NAME" "$FILE_NAME.sha256" --title "$PATCH_CODE" --notes "UMS Rappang native portal patch. PHP lint, SQL guard, application-root validation, ZIP integrity, and SHA-256 checks passed."
          fi
